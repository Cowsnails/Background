<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermassive Black Hole - WebGL Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 100;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        .control-group {
            margin: 10px 0;
        }

        label {
            display: inline-block;
            width: 150px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 150px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="loading">Loading Black Hole...</div>

    <div id="info" style="display: none;">
        <h3>🌌 Supermassive Black Hole</h3>
        <p>WebGL/Three.js Animation</p>
        <p style="margin-top: 10px; font-size: 11px;">
            Mouse: Rotate View<br>
            Scroll: Zoom In/Out
        </p>
    </div>

    <div id="controls" style="display: none;">
        <div class="control-group">
            <label>Disk Speed:</label>
            <input type="range" id="diskSpeed" min="0.1" max="3" step="0.1" value="1">
            <span id="diskSpeedValue">1.0</span>
        </div>
        <div class="control-group">
            <label>Particle Density:</label>
            <input type="range" id="particleDensity" min="1000" max="20000" step="1000" value="10000">
            <span id="particleDensityValue">10000</span>
        </div>
        <div class="control-group">
            <label>Glow Intensity:</label>
            <input type="range" id="glowIntensity" min="0" max="2" step="0.1" value="1">
            <span id="glowIntensityValue">1.0</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        let scene, camera, renderer;
        let blackHole, accretionDisk, particles, starField;
        let clock = new THREE.Clock();

        // Animation parameters
        const params = {
            diskRotationSpeed: 1.0,
            particleCount: 10000,
            glowIntensity: 1.0
        };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.00025);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                10000
            );
            camera.position.set(0, 30, 100);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 1);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffa500, 2, 1000);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Create components
            createStarField();
            createBlackHole();
            createAccretionDisk();
            createParticleSystem();
            createRelativisticJets();

            // Controls
            setupControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);

            // Mouse interaction
            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            // Hide loading, show UI
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').style.display = 'block';
                document.getElementById('controls').style.display = 'block';
            }, 1000);

            animate();
        }

        function createStarField() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 15000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;

                // Random spherical distribution
                const radius = 2000 + Math.random() * 3000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);

                // Star colors (mostly white with some blue/red variation)
                const colorVariation = Math.random();
                if (colorVariation > 0.95) {
                    colors[i3] = 0.5 + Math.random() * 0.5;
                    colors[i3 + 1] = 0.7 + Math.random() * 0.3;
                    colors[i3 + 2] = 1.0;
                } else if (colorVariation > 0.9) {
                    colors[i3] = 1.0;
                    colors[i3 + 1] = 0.6 + Math.random() * 0.2;
                    colors[i3 + 2] = 0.4 + Math.random() * 0.2;
                } else {
                    const brightness = 0.7 + Math.random() * 0.3;
                    colors[i3] = brightness;
                    colors[i3 + 1] = brightness;
                    colors[i3 + 2] = brightness;
                }

                sizes[i] = Math.random() * 2 + 0.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending
            });

            starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
        }

        function createBlackHole() {
            // Event horizon (perfectly black sphere)
            const eventHorizonGeometry = new THREE.SphereGeometry(8, 64, 64);
            const eventHorizonMaterial = new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.FrontSide
            });

            const eventHorizon = new THREE.Mesh(eventHorizonGeometry, eventHorizonMaterial);

            // Photon sphere glow
            const photonSphereGeometry = new THREE.SphereGeometry(10, 64, 64);
            const photonSphereMaterial = new THREE.MeshBasicMaterial({
                color: 0xff8800,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });

            const photonSphere = new THREE.Mesh(photonSphereGeometry, photonSphereMaterial);

            blackHole = new THREE.Group();
            blackHole.add(eventHorizon);
            blackHole.add(photonSphere);

            scene.add(blackHole);
        }

        function createAccretionDisk() {
            accretionDisk = new THREE.Group();

            // Create multiple layers for depth and realism
            const layers = 12;

            for (let layer = 0; layer < layers; layer++) {
                const innerRadius = 12 + layer * 2;
                const outerRadius = innerRadius + 6;
                const segments = 128;

                const geometry = new THREE.RingGeometry(innerRadius, outerRadius, segments, 8);

                // Create custom shader material for the disk
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        layer: { value: layer },
                        innerRadius: { value: innerRadius },
                        outerRadius: { value: outerRadius },
                        glowIntensity: { value: 1.0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        varying vec3 vPosition;

                        void main() {
                            vUv = uv;
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        uniform float layer;
                        uniform float innerRadius;
                        uniform float outerRadius;
                        uniform float glowIntensity;

                        varying vec2 vUv;
                        varying vec3 vPosition;

                        void main() {
                            float radius = length(vPosition.xy);
                            float normalizedRadius = (radius - innerRadius) / (outerRadius - innerRadius);

                            // Color gradient (hot inner to cool outer)
                            vec3 innerColor = vec3(1.0, 1.0, 0.95); // White-yellow (hottest)
                            vec3 midColor = vec3(1.0, 0.6, 0.1);    // Orange
                            vec3 outerColor = vec3(0.8, 0.2, 0.05); // Red-orange

                            vec3 color;
                            if (normalizedRadius < 0.5) {
                                color = mix(innerColor, midColor, normalizedRadius * 2.0);
                            } else {
                                color = mix(midColor, outerColor, (normalizedRadius - 0.5) * 2.0);
                            }

                            // Spiral patterns
                            float angle = atan(vPosition.y, vPosition.x);
                            float spiral = sin(angle * 8.0 - time * 2.0 + radius * 0.3) * 0.5 + 0.5;

                            // Turbulence
                            float turbulence = sin(radius * 0.5 + time + layer * 0.5) * 0.3 + 0.7;

                            // Opacity falloff
                            float opacity = (1.0 - normalizedRadius) * 0.7 * turbulence;
                            opacity *= (1.0 - layer / 12.0) * 0.8 + 0.2;

                            // Add brightness variation
                            float brightness = spiral * 0.3 + 0.7;
                            color *= brightness * glowIntensity;

                            gl_FragColor = vec4(color, opacity);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.x = -Math.PI / 2;
                ring.rotation.z = (layer / layers) * Math.PI * 2;

                accretionDisk.add(ring);
            }

            scene.add(accretionDisk);
        }

        function createParticleSystem() {
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = params.particleCount;

            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const ages = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Initialize particles in spiral orbits
                const radius = 15 + Math.random() * 50;
                const theta = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * 10;

                positions[i3] = Math.cos(theta) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(theta) * radius;

                // Orbital velocity
                const speed = 1.0 / Math.sqrt(radius);
                velocities[i3] = -Math.sin(theta) * speed;
                velocities[i3 + 1] = 0;
                velocities[i3 + 2] = Math.cos(theta) * speed;

                // Color based on temperature (closer = hotter = bluer)
                const temp = 1.0 - (radius / 65.0);
                colors[i3] = 0.6 + temp * 0.4;
                colors[i3 + 1] = 0.4 + temp * 0.3;
                colors[i3 + 2] = 0.2 + temp * 0.6;

                sizes[i] = Math.random() * 0.5 + 0.3;
                ages[i] = Math.random();
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            particleGeometry.setAttribute('age', new THREE.BufferAttribute(ages, 1));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
        }

        function createRelativisticJets() {
            // Create particle jets shooting from the poles
            const jetGeometry = new THREE.BufferGeometry();
            const jetCount = 2000;

            const positions = new Float32Array(jetCount * 3);
            const colors = new Float32Array(jetCount * 3);
            const sizes = new Float32Array(jetCount);

            for (let i = 0; i < jetCount; i++) {
                const i3 = i * 3;
                const isTopJet = i < jetCount / 2;

                const height = Math.random() * 200 + 10;
                const spread = Math.random() * 3;
                const angle = Math.random() * Math.PI * 2;

                positions[i3] = Math.cos(angle) * spread;
                positions[i3 + 1] = (isTopJet ? 1 : -1) * height;
                positions[i3 + 2] = Math.sin(angle) * spread;

                // Blue-white jets
                const intensity = 1.0 - (Math.random() * 0.3);
                colors[i3] = intensity * 0.7;
                colors[i3 + 1] = intensity * 0.8;
                colors[i3 + 2] = intensity;

                sizes[i] = Math.random() * 1.5 + 0.5;
            }

            jetGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            jetGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            jetGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const jetMaterial = new THREE.PointsMaterial({
                size: 1.0,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            const jets = new THREE.Points(jetGeometry, jetMaterial);
            scene.add(jets);
        }

        function updateParticles(delta) {
            const positions = particles.geometry.attributes.position.array;
            const velocities = particles.geometry.attributes.velocity.array;
            const colors = particles.geometry.attributes.color.array;
            const ages = particles.geometry.attributes.age.array;

            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = positions[i + 2];

                const radius = Math.sqrt(x * x + z * z);
                const distance3D = Math.sqrt(x * x + y * y + z * z);

                // Check if particle reached event horizon
                if (distance3D < 8) {
                    // Respawn at outer edge
                    const newRadius = 50 + Math.random() * 15;
                    const newTheta = Math.random() * Math.PI * 2;
                    const newHeight = (Math.random() - 0.5) * 10;

                    positions[i] = Math.cos(newTheta) * newRadius;
                    positions[i + 1] = newHeight;
                    positions[i + 2] = Math.sin(newTheta) * newRadius;

                    ages[i / 3] = 0;
                } else {
                    // Spiral inward with orbital motion
                    const theta = Math.atan2(z, x);
                    const orbitSpeed = params.diskRotationSpeed / Math.sqrt(radius) * delta * 5;
                    const inwardSpeed = delta * 2;

                    const newRadius = radius - inwardSpeed;
                    const newTheta = theta + orbitSpeed;

                    positions[i] = Math.cos(newTheta) * newRadius;
                    positions[i + 2] = Math.sin(newTheta) * newRadius;

                    // Pull toward equatorial plane
                    positions[i + 1] *= 0.99;

                    // Update color based on proximity (relativistic blue shift)
                    const temp = 1.0 - (newRadius / 65.0);
                    colors[i] = 0.6 + temp * 0.4;
                    colors[i + 1] = 0.4 + temp * 0.3;
                    colors[i + 2] = 0.2 + temp * 0.6;

                    ages[i / 3] += delta;
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            particles.geometry.attributes.age.needsUpdate = true;
        }

        function setupControls() {
            document.getElementById('diskSpeed').addEventListener('input', (e) => {
                params.diskRotationSpeed = parseFloat(e.target.value);
                document.getElementById('diskSpeedValue').textContent = e.target.value;
            });

            document.getElementById('particleDensity').addEventListener('input', (e) => {
                document.getElementById('particleDensityValue').textContent = e.target.value;
            });

            document.getElementById('glowIntensity').addEventListener('input', (e) => {
                params.glowIntensity = parseFloat(e.target.value);
                document.getElementById('glowIntensityValue').textContent = e.target.value;

                // Update accretion disk glow
                accretionDisk.children.forEach(ring => {
                    if (ring.material.uniforms) {
                        ring.material.uniforms.glowIntensity.value = params.glowIntensity;
                    }
                });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Rotate accretion disk
            accretionDisk.children.forEach((ring, index) => {
                const layerSpeed = 1.0 / (index + 1);
                ring.rotation.z += delta * params.diskRotationSpeed * layerSpeed * 0.3;

                // Update shader time
                if (ring.material.uniforms) {
                    ring.material.uniforms.time.value = elapsed;
                }
            });

            // Update particle system
            updateParticles(delta);

            // Subtle camera movement
            camera.position.x += (Math.sin(elapsed * 0.1) * 0.5 - camera.position.x) * 0.01;
            camera.position.y += (30 + Math.cos(elapsed * 0.15) * 5 - camera.position.y) * 0.01;
            camera.lookAt(0, 0, 0);

            // Slow starfield rotation
            starField.rotation.y += delta * 0.01;

            // Pulse the black hole glow
            if (blackHole.children[1]) {
                blackHole.children[1].material.opacity = 0.05 + Math.sin(elapsed * 2) * 0.03;
            }

            // Render the scene
            renderer.render(scene, camera);
        }

        // Start the animation
        init();
    </script>
</body>
</html>
