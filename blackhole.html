<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermassive Black Hole - Exact Recreation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 100;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        .control-group {
            margin: 10px 0;
        }

        label {
            display: inline-block;
            width: 150px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 150px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Supermassive Black Hole</h3>
        <p>Exact Recreation - Animated</p>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Rotation Speed:</label>
            <input type="range" id="rotationSpeed" min="0.1" max="3" step="0.1" value="0.5">
            <span id="rotationSpeedValue">0.5</span>
        </div>
        <div class="control-group">
            <label>Flare Intensity:</label>
            <input type="range" id="flareIntensity" min="0.5" max="3" step="0.1" value="1.5">
            <span id="flareIntensityValue">1.5</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blackHole, accretionDisk, leftFlare, rightStream, nebula;
        let clock = new THREE.Clock();

        const params = {
            rotationSpeed: 0.5,
            flareIntensity: 1.5
        };

        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera - positioned to match the exact viewing angle from the image
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                10000
            );
            // Position camera to get that tilted view
            camera.position.set(20, 50, 80);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 1);
            document.body.appendChild(renderer.domElement);

            // Create the scene
            createNebulaBackground();
            createBlackHoleCore();
            createAsymmetricAccretionDisk();
            createLeftFlare();
            createRightStream();
            createMagneticFieldLines();

            // Lighting - asymmetric to match image
            const leftLight = new THREE.PointLight(0xffaa00, 3, 200);
            leftLight.position.set(-40, -20, 20);
            scene.add(leftLight);

            const rightLight = new THREE.PointLight(0x0088ff, 0.5, 200);
            rightLight.position.set(40, 0, 20);
            scene.add(rightLight);

            const ambientLight = new THREE.AmbientLight(0x111111);
            scene.add(ambientLight);

            // Controls
            setupControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createNebulaBackground() {
            nebula = new THREE.Group();

            // Create nebula clouds with colors matching the image
            // Left side - reddish/orange nebula
            const leftNebulaGeo = new THREE.SphereGeometry(3000, 32, 32);
            const leftNebulaMat = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: `
                    varying vec3 vPosition;
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;

                    void main() {
                        vec3 color = vec3(0.0);

                        // Left side - reddish orange
                        if (vPosition.x < 0.0) {
                            float intensity = smoothstep(0.0, -3000.0, vPosition.x) * 0.15;
                            color = vec3(0.3, 0.1, 0.05) * intensity;
                        }
                        // Right side - blue/cyan
                        else {
                            float intensity = smoothstep(0.0, 3000.0, vPosition.x) * 0.1;
                            color = vec3(0.05, 0.1, 0.2) * intensity;
                        }

                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.BackSide,
                transparent: true
            });

            const leftNebula = new THREE.Mesh(leftNebulaGeo, leftNebulaMat);
            nebula.add(leftNebula);

            // Add stars
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 8000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                const radius = 1000 + Math.random() * 4000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);

                const brightness = 0.5 + Math.random() * 0.5;
                colors[i3] = brightness;
                colors[i3 + 1] = brightness * 0.9;
                colors[i3 + 2] = brightness * 0.8;

                sizes[i] = Math.random() * 1.5 + 0.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 1.0,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            nebula.add(stars);

            scene.add(nebula);
        }

        function createBlackHoleCore() {
            blackHole = new THREE.Group();

            // Event horizon
            const eventHorizonGeo = new THREE.SphereGeometry(8, 64, 64);
            const eventHorizonMat = new THREE.MeshBasicMaterial({
                color: 0x000000
            });
            const eventHorizon = new THREE.Mesh(eventHorizonGeo, eventHorizonMat);

            // Inner glow (photon sphere)
            const glowGeo = new THREE.SphereGeometry(9, 64, 64);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffaa44,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);

            blackHole.add(eventHorizon);
            blackHole.add(glow);
            scene.add(blackHole);
        }

        function createAsymmetricAccretionDisk() {
            accretionDisk = new THREE.Group();

            // Create multiple disk layers with EXACT asymmetric coloring from the image
            const diskLayers = 15;

            for (let layer = 0; layer < diskLayers; layer++) {
                const innerRadius = 10 + layer * 3;
                const outerRadius = innerRadius + 5;

                const geometry = new THREE.RingGeometry(innerRadius, outerRadius, 128, 6);

                // Custom shader matching the EXACT image colors
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        layer: { value: layer },
                        innerRadius: { value: innerRadius },
                        outerRadius: { value: outerRadius },
                        flareIntensity: { value: params.flareIntensity }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        varying vec3 vPosition;

                        void main() {
                            vUv = uv;
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        uniform float layer;
                        uniform float innerRadius;
                        uniform float outerRadius;
                        uniform float flareIntensity;

                        varying vec2 vUv;
                        varying vec3 vPosition;

                        void main() {
                            float radius = length(vPosition.xy);
                            float normalizedRadius = (radius - innerRadius) / (outerRadius - innerRadius);
                            float angle = atan(vPosition.y, vPosition.x);

                            // Asymmetric brightness - MUCH brighter on left (negative X)
                            float azimuth = atan(vPosition.y, vPosition.x);

                            // Left side gets MASSIVE brightness boost (matching the bright flare in image)
                            float leftBrightness = smoothstep(0.0, 3.14, azimuth + 3.14) * 3.0;

                            // Right side is darker with blue tint
                            float rightDarkness = smoothstep(3.14, 0.0, azimuth + 3.14) * 0.3;

                            float asymmetry = leftBrightness + rightDarkness;

                            // Temperature-based colors matching the exact image
                            vec3 innerColor = vec3(1.0, 1.0, 0.95);     // White-yellow (hottest)
                            vec3 midColor = vec3(1.0, 0.5, 0.1);        // Bright orange
                            vec3 outerColor = vec3(0.6, 0.15, 0.05);    // Dark red-orange

                            vec3 color;
                            if (normalizedRadius < 0.4) {
                                color = mix(innerColor, midColor, normalizedRadius / 0.4);
                            } else {
                                color = mix(midColor, outerColor, (normalizedRadius - 0.4) / 0.6);
                            }

                            // Add blue tint on right side (positive X)
                            if (vPosition.x > 0.0) {
                                float blueTint = vPosition.x / radius * 0.4;
                                color = mix(color, vec3(0.3, 0.5, 0.8), blueTint);
                            }

                            // Spiral structure
                            float spiral = sin(angle * 5.0 - time * 0.5 + radius * 0.2) * 0.5 + 0.5;

                            // Turbulent flow
                            float turbulence = sin(radius * 0.3 + time * 0.3 + layer * 0.2) * 0.4 + 0.6;

                            // Opacity with asymmetry
                            float opacity = (1.0 - normalizedRadius * 0.7) * turbulence * spiral;
                            opacity *= asymmetry * flareIntensity;
                            opacity *= (1.0 - layer / 15.0) * 0.5 + 0.5;

                            // Brightness boost
                            color *= (spiral * 0.5 + 0.5) * asymmetry;

                            gl_FragColor = vec4(color, opacity * 0.8);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.x = -Math.PI / 2;

                // Slight tilt to match the image
                ring.rotation.y = layer * 0.05;

                accretionDisk.add(ring);
            }

            // Tilt the entire disk to match viewing angle
            accretionDisk.rotation.x = -0.3;

            scene.add(accretionDisk);
        }

        function createLeftFlare() {
            // The BRIGHT orange-yellow flare on the left side matching the image
            leftFlare = new THREE.Group();

            // Main flare particles
            const flareGeo = new THREE.BufferGeometry();
            const flareCount = 5000;
            const positions = new Float32Array(flareCount * 3);
            const colors = new Float32Array(flareCount * 3);
            const sizes = new Float32Array(flareCount);

            for (let i = 0; i < flareCount; i++) {
                const i3 = i * 3;

                // Create upward spray on the left side
                const spreadX = (Math.random() - 1) * 30 - 20; // Bias to left
                const spreadY = Math.random() * 60 - 10; // Spray upward
                const spreadZ = (Math.random() - 0.5) * 15;

                positions[i3] = spreadX;
                positions[i3 + 1] = spreadY;
                positions[i3 + 2] = spreadZ;

                // Bright yellow-orange-white colors
                const heat = Math.random();
                if (heat > 0.7) {
                    // Hottest - white
                    colors[i3] = 1.0;
                    colors[i3 + 1] = 1.0;
                    colors[i3 + 2] = 0.9;
                } else if (heat > 0.4) {
                    // Hot - yellow
                    colors[i3] = 1.0;
                    colors[i3 + 1] = 0.8;
                    colors[i3 + 2] = 0.3;
                } else {
                    // Warm - orange
                    colors[i3] = 1.0;
                    colors[i3 + 1] = 0.5;
                    colors[i3 + 2] = 0.1;
                }

                sizes[i] = Math.random() * 2 + 0.5;
            }

            flareGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            flareGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            flareGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const flareMat = new THREE.PointsMaterial({
                size: 2.0,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            const flare = new THREE.Points(flareGeo, flareMat);
            leftFlare.add(flare);

            // Add a bright glow sphere at the base of the flare
            const glowGeo = new THREE.SphereGeometry(15, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffffaa,
                transparent: true,
                opacity: 0.4
            });
            const glowSphere = new THREE.Mesh(glowGeo, glowMat);
            glowSphere.position.set(-25, -5, 0);
            leftFlare.add(glowSphere);

            scene.add(leftFlare);
        }

        function createRightStream() {
            // The cooler blue-cyan stream on the right
            rightStream = new THREE.Group();

            const streamGeo = new THREE.BufferGeometry();
            const streamCount = 2000;
            const positions = new Float32Array(streamCount * 3);
            const colors = new Float32Array(streamCount * 3);
            const sizes = new Float32Array(streamCount);

            for (let i = 0; i < streamCount; i++) {
                const i3 = i * 3;

                const spreadX = Math.random() * 40 + 10; // Right side
                const spreadY = (Math.random() - 0.5) * 30;
                const spreadZ = (Math.random() - 0.5) * 20;

                positions[i3] = spreadX;
                positions[i3 + 1] = spreadY;
                positions[i3 + 2] = spreadZ;

                // Blue-cyan colors
                const temp = Math.random();
                colors[i3] = 0.2 + temp * 0.3;
                colors[i3 + 1] = 0.4 + temp * 0.4;
                colors[i3 + 2] = 0.6 + temp * 0.4;

                sizes[i] = Math.random() * 1.2 + 0.3;
            }

            streamGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            streamGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            streamGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const streamMat = new THREE.PointsMaterial({
                size: 1.0,
                vertexColors: true,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            const stream = new THREE.Points(streamGeo, streamMat);
            rightStream.add(stream);

            scene.add(rightStream);
        }

        function createMagneticFieldLines() {
            // Create the fibrous texture around the event horizon
            const linesGeo = new THREE.BufferGeometry();
            const lineCount = 3000;
            const positions = new Float32Array(lineCount * 3);
            const colors = new Float32Array(lineCount * 3);
            const sizes = new Float32Array(lineCount);

            for (let i = 0; i < lineCount; i++) {
                const i3 = i * 3;
                const angle = (i / lineCount) * Math.PI * 2 * 8; // Multiple wraps
                const radius = 8 + Math.random() * 3;
                const height = (Math.random() - 0.5) * 2;

                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(angle) * radius;

                // Orange glow
                const brightness = 0.5 + Math.random() * 0.5;
                colors[i3] = brightness;
                colors[i3 + 1] = brightness * 0.5;
                colors[i3 + 2] = brightness * 0.1;

                sizes[i] = 0.5;
            }

            linesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            linesGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            linesGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const linesMat = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            const lines = new THREE.Points(linesGeo, linesMat);
            scene.add(lines);
        }

        function setupControls() {
            document.getElementById('rotationSpeed').addEventListener('input', (e) => {
                params.rotationSpeed = parseFloat(e.target.value);
                document.getElementById('rotationSpeedValue').textContent = e.target.value;
            });

            document.getElementById('flareIntensity').addEventListener('input', (e) => {
                params.flareIntensity = parseFloat(e.target.value);
                document.getElementById('flareIntensityValue').textContent = e.target.value;

                accretionDisk.children.forEach(ring => {
                    if (ring.material.uniforms) {
                        ring.material.uniforms.flareIntensity.value = params.flareIntensity;
                    }
                });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Rotate accretion disk
            accretionDisk.children.forEach((ring, index) => {
                const layerSpeed = 1.0 / (index * 0.5 + 1);
                ring.rotation.z += delta * params.rotationSpeed * layerSpeed * 0.2;

                if (ring.material.uniforms) {
                    ring.material.uniforms.time.value = elapsed;
                }
            });

            // Animate left flare (pulsing)
            if (leftFlare.children[1]) {
                const pulse = Math.sin(elapsed * 2) * 0.1 + 0.9;
                leftFlare.children[1].material.opacity = 0.4 * pulse;
                leftFlare.children[1].scale.set(pulse, pulse, pulse);
            }

            // Subtle rotation of the entire scene
            accretionDisk.rotation.z += delta * params.rotationSpeed * 0.05;

            // Animate flare particles
            if (leftFlare.children[0]) {
                leftFlare.children[0].rotation.y += delta * 0.1;
            }

            // Pulse black hole glow
            if (blackHole.children[1]) {
                blackHole.children[1].material.opacity = 0.1 + Math.sin(elapsed * 1.5) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // Start
        init();
    </script>
</body>
</html>
